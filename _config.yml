title: BL King Consulting
description: "Managed IT, cybersecurity, and compliance services for businesses nationwide. Veteran-owned. CMMC, DFARS, NIST 800-171/800-53 compliance specialists."
url: "https://www.blking.net"
baseurl: ""

# Google Tag Manager. Set this to the real container ID (GTM-XXXXXXX).
# While it is empty the GTM snippet does not render at all, which is deliberate -
# loading GTM with an empty or placeholder ID looks configured and collects nothing.
gtm_container_id: ""

# Business info (used across templates + schema)
company_name: "BL King Consulting"
company_phone: "978-688-1739"
company_email: "info@blking.net"
company_address_line1: "733 Turnpike St., #246"
company_address_city: "North Andover"
company_address_state: "MA"
company_address_zip: "01845"
founded_year: 2014

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /:path/

collections:
  posts:
    output: true
    permalink: /:slug/

defaults:
  - scope:
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  # Finding 5: the seven PDFs under wp-images/ are byte-duplicates of the ones
  # under assets/images/wp-content/, and jekyll-sitemap listed both paths for each.
  # Content references /assets/images/wp-content/ 859 times and /wp-images/ zero
  # times, so assets/ is the canonical path. These stay published (any existing
  # inbound link keeps working) but are dropped from sitemap.xml.
  - scope:
      path: "wp-images"
    values:
      sitemap: false

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.ps1"
  - wp-export
