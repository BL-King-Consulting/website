title: BL King Consulting
description: "Managed IT, cybersecurity, and compliance services for businesses nationwide. Veteran-owned. CMMC, DFARS, NIST 800-171/800-53 compliance specialists."
url: "https://www.blking.net"
baseurl: ""

# Business info (used across templates + schema)
company_name: "BL King Consulting"
company_phone: "978-688-1739"
company_email: "info@blking.net"
company_address_line1: "733 Turnpike St., #246"
company_address_city: "North Andover"
company_address_state: "MA"
company_address_zip: "01845"
founded_year: 2014

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /:path/

collections:
  posts:
    output: true
    permalink: /:slug/
special_page:
defaults:
  - scope:
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# Analytics. Leave an ID empty to drop that tag from every page.
google_tag_manager_id: "GTM-TSJR3TD"
google_tag_id: "GT-WK2NR4L"
umami_script_url: "https://analytics.blk.ing/script.js"
umami_website_id: "d8694527-57eb-43a0-9c7b-41c6d95049bf"

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.ps1"
  - wp-export
