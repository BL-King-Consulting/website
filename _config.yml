title: BL King Consulting
description: "Managed IT, cybersecurity, and compliance services for businesses nationwide. Veteran-owned. CMMC, DFARS, NIST 800-171/800-53 compliance specialists."
url: "https://www.blking.net"
baseurl: ""

# CMMC cost calculator widget (BL-King-Consulting/cmmc-calculator). Set to the
# hosted URL of blkc-calculator.js to show the estimator on /compliance/cmmc/.
# Empty = the section is not rendered (it used to render as an empty heading).
cmmc_calculator_src: ""

# Free Risk Assessment form. Paste the uSecure embed snippet here; while empty,
# /free-risk-assessment/ shows booking and contact buttons instead of a blank form.
usecure_embed_html: ""

# Default blog byline for BlogPosting schema (a post can override with `author:`).
# Empty = the company is listed as author.
author: ""

# Business info (used across templates + schema)
company_name: "BL King Consulting"
company_phone: "978-688-1739"
company_email: "info@blking.net"
company_address_line1: "733 Turnpike St., #246"
company_address_city: "North Andover"
company_address_state: "MA"
company_address_zip: "01845"
founded_year: 2014

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

permalink: /:path/

collections:
  posts:
    output: true
    permalink: /:slug/
special_page:
defaults:
  - scope:
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  # Finding 5: the seven PDFs under wp-images/ are byte-duplicates of the ones
  # under assets/images/wp-content/, and jekyll-sitemap listed both paths for each.
  # Content references /assets/images/wp-content/ 859 times and /wp-images/ zero
  # times, so assets/ is the canonical path. These stay published (any existing
  # inbound link keeps working) but are dropped from sitemap.xml.
  - scope:
      path: "wp-images"
    values:
      sitemap: false
  # Category archives are thin listing pages (several exist only as redirect
  # targets for old /it-solutions/ URLs); keep them out of sitemap.xml.
  - scope:
      path: "category"
    values:
      sitemap: false

# Analytics. Leave an ID empty to drop that tag from every page.
google_tag_manager_id: "GTM-TSJR3TD"
google_tag_id: "GT-WK2NR4L"
umami_script_url: "https://analytics.blk.ing/script.js"
umami_website_id: "d8694527-57eb-43a0-9c7b-41c6d95049bf"

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.ps1"
  - wp-export
