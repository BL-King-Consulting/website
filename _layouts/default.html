<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  {% include seo.html %}
  {% include schema-organization.html %}
  {% if page.schema_service %}{% include schema-service.html key=page.schema_service %}{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" href="/assets/images/favicon.png">

  <!-- TODO(Gerald): replace GTM-XXXXXXX with the real GTM Container ID before launch.
       The live site loads gtm.js (via the Site Kit by Google plugin), so this matches
       that setup rather than a bare gtag.js snippet. -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>

</head>
<body>
  <!-- TODO(Gerald): GTM-XXXXXXX must match the <script> above -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% include floating-contact.html %}
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
