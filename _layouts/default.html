<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  {% include seo.html %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" href="/assets/images/favicon.png">

  {%- if site.gtm_container_id and site.gtm_container_id != "" %}
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','{{ site.gtm_container_id }}');</script>
  {%- endif %}

</head>
<body>
  {%- if site.gtm_container_id and site.gtm_container_id != "" %}
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ site.gtm_container_id }}"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  {%- endif %}

  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% include floating-contact.html %}
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
